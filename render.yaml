services:
  - type: web
    name: money-manager
    runtime: node
    plan: free
    region: singapore
    rootDir: core
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: AUTH_ADMIN_EMAILS
        value: jackbereson@gmail.com
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: money_manager
